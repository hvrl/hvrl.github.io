                transform: scaleX(1);
            }

            60% {
                transform: scaleX(1);
            }

            62% {
                transform: scaleX(0);
            }

            64% {
                transform: scaleX(1);
            }

            100% {
                transform: scaleX(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .hvrl-logo-v *,
            .hvrl-logo-v .eye {
                animation: none;
                transform: none;
            }
        }
